# Claude Token Saviour — Configuration
# See README.md for full documentation.

models:
  # Map complexity tiers to Claude model identifiers
  simple: claude-3-5-haiku-20241022
  moderate: claude-sonnet-4-20250514
  complex: claude-opus-4-20250514

routing:
  # Default tier when classification is inconclusive
  default_tier: moderate
  # Automatically retry with a stronger model on failure
  auto_fallback: true
  # Maximum number of fallback retries
  max_retries: 1

budget:
  # Daily spending limit in USD (0 = unlimited)
  daily_limit_usd: 10.00
  # Alert when spending reaches this percentage of the daily limit
  alert_threshold_pct: 80

tracking:
  # Enable/disable usage tracking
  enabled: true
  # Path to the usage data file
  data_file: usage_data.json

optimization:
  # Automatically compress prompts before sending
  compress_prompts: true
  # Strip code comments from context (aggressive)
  strip_comments: false
  # Suggest max_tokens based on task type
  suggest_max_tokens: true
